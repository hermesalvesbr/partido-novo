<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" preserveAspectRatio="xMidYMid slice">
  <!-- Paisagem do Sertão do Araripe: céu, Chapada do Araripe e caatinga -->
  <defs>
    <linearGradient id="ceu" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e7fd8"/>
      <stop offset="0.45" stop-color="#5fb3f0"/>
      <stop offset="0.62" stop-color="#bfe3fa"/>
      <stop offset="0.7" stop-color="#ffe7b0"/>
    </linearGradient>
    <linearGradient id="chapada" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a6a4f"/>
      <stop offset="1" stop-color="#5b4a3a"/>
    </linearGradient>
    <linearGradient id="chao" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c9a46a"/>
      <stop offset="1" stop-color="#a77d47"/>
    </linearGradient>
    <radialGradient id="sol" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff6c8"/>
      <stop offset="0.5" stop-color="#ffe17a" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffd34d" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1080" height="1920" fill="url(#ceu)"/>
  <circle cx="820" cy="980" r="260" fill="url(#sol)"/>

  <!-- nuvens -->
  <g fill="#ffffff" opacity="0.9">
    <ellipse cx="200" cy="760" rx="170" ry="48"/>
    <ellipse cx="290" cy="730" rx="110" ry="52"/>
    <ellipse cx="760" cy="640" rx="190" ry="44"/>
    <ellipse cx="860" cy="612" rx="100" ry="46"/>
    <ellipse cx="520" cy="900" rx="140" ry="32"/>
  </g>

  <!-- Chapada do Araripe (topo plano) -->
  <path d="M0 1120 L140 1080 L260 1050 L900 1045 L1000 1070 L1080 1090 L1080 1260 L0 1260 Z" fill="url(#chapada)" opacity="0.85"/>
  <path d="M0 1170 L80 1150 L300 1140 L520 1155 L760 1140 L1080 1160 L1080 1300 L0 1300 Z" fill="#6f7d4a"/>

  <!-- cidade ao longe -->
  <g fill="#f4efe6">
    <rect x="120" y="1195" width="70" height="55"/>
    <rect x="200" y="1180" width="50" height="70"/>
    <rect x="262" y="1205" width="90" height="45"/>
    <rect x="640" y="1190" width="60" height="60"/>
    <rect x="712" y="1170" width="40" height="80"/>
    <rect x="764" y="1200" width="110" height="50"/>
    <rect x="455" y="1120" width="34" height="130"/>
    <polygon points="452,1120 472,1085 492,1120"/>
  </g>
  <g fill="#e2622f">
    <rect x="115" y="1188" width="80" height="10"/>
    <rect x="258" y="1198" width="98" height="10"/>
    <rect x="760" y="1193" width="118" height="10"/>
  </g>

  <!-- chão e caatinga -->
  <rect y="1250" width="1080" height="670" fill="url(#chao)"/>
  <g fill="#4f6b32">
    <ellipse cx="60" cy="1300" rx="110" ry="70"/>
    <ellipse cx="980" cy="1290" rx="140" ry="80"/>
    <ellipse cx="560" cy="1270" rx="90" ry="40"/>
    <ellipse cx="360" cy="1285" rx="70" ry="38"/>
  </g>
  <g fill="#3f5728">
    <ellipse cx="150" cy="1360" rx="120" ry="60"/>
    <ellipse cx="900" cy="1370" rx="150" ry="70"/>
  </g>
</svg>
